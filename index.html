<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Última Gota – Prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <div id="hud" class="hud" hidden></div>
  <div id="game"></div>
  <p class="note">Prototipo de validación del diseño de “Última Gota”, Proyecto de Aula Programación III, Grupo 7. Los valores siguen el GDD y se ajustarán en las pruebas.</p>
</div>

<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle">
  <div class="box">
    <h2 id="mtitle">¿Seguro que quieres salir?</h2>
    <p>Perderás todo tu progreso. No hay forma de volver a esta partida.</p>
    <div class="row">
      <button class="primary" id="mYes">Sí, salir</button>
      <button class="secondary" id="mNo">No, seguir jugando</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
